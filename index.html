<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de chat</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#14213d;--muted:#5d6b82;--line:#d9dfe8;--accent:#1f4fd8;--bad:#c0392b;--ok:#1b7f5a}
@media (prefers-color-scheme: dark){:root{--bg:#0e1522;--surface:#172033;--ink:#e8edf6;--muted:#98a5bd;--line:#2a3650;--accent:#6d93ff;--bad:#ff7b6b;--ok:#4cc79a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:1.2rem;margin:0}.sp{flex:1}.status{font-size:.85rem;color:var(--muted)}.status.err{color:var(--bad)}
main{max-width:900px;margin:0 auto;padding:24px}
.box,.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:12px}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,#drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#drop{border:2px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:12px}
#prev{max-width:100%;max-height:260px;margin-top:10px;border-radius:6px}
h2{font-size:1.05rem;margin:0 0 8px}.meta{font-size:.85rem;color:var(--muted)}
.warn{color:var(--bad);font-weight:600}.yes{color:var(--bad);font-weight:650}.no{color:var(--ok);font-weight:650}
.loading{color:var(--muted);font-style:italic}ol{margin:6px 0 12px;padding-left:22px}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-left:6px}
</style>
</head>
<body>
<header><h1>Assistente de chat</h1><span class="sp"></span><span class="status" id="status"></span><button id="btnToken" hidden>Trocar token</button></header>
<main>
<section id="gate" class="box">
  <label>Token da API do Movidesk <input type="password" id="token" autocomplete="off" placeholder="Cole seu token"></label>
  <button id="enter" class="primary">Entrar</button>
  <p class="meta">O token fica salvo apenas neste navegador.</p>
</section>
<section id="app" hidden>
  <div id="noai" class="card warn" hidden>A IA ainda não está configurada: preencha WORKER_URL no início do script do index.html (veja as instruções do worker.js).</div>
  <div class="box">
    <div id="drop" tabindex="0">Cole o print do chat aqui (Ctrl + V) ou clique para escolher uma imagem<input type="file" id="file" accept="image/*" hidden></div>
    <img id="prev" alt="Print do chat" hidden>
    <label>Texto copiado do chat <textarea id="txt" rows="7" placeholder="Cole aqui a conversa"></textarea></label>
    <label>Nome do cliente (opcional, se não aparecer no print ou no texto) <input id="cli"></label>
    <button id="go" class="primary">Analisar</button>
  </div>
  <div id="out"></div>
</section>
</main>
<script>
(function(){
  var WORKER_URL = "https://assistente-chat.weslley-0f1.workers.dev"; // endereço do Worker, ex.: https://assistente.seu-usuario.workers.dev
  var LS = "movidesk_assist_v1", $ = function(i){ return document.getElementById(i); };
  var token = ""; try { token = localStorage.getItem(LS) || ""; } catch(e){}
  var img = null, lastCall = 0, GAP = 6200;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function setStatus(m, err){ var e = $("status"); e.textContent = m; e.className = "status" + (err ? " err" : ""); }
  function utc(iso){ return new Date(/[zZ]$|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z"); }
  function show(){ var ok = !!token; $("gate").hidden = ok; $("app").hidden = !ok; $("btnToken").hidden = !ok; $("noai").hidden = !!WORKER_URL; }
  $("enter").onclick = function(){ token = $("token").value.trim(); if (!token) return; try { localStorage.setItem(LS, token); } catch(e){} show(); };
  $("btnToken").onclick = function(){ token = ""; try { localStorage.removeItem(LS); } catch(e){} $("token").value = ""; show(); };

  // ---- print: colar (Ctrl+V) ou escolher arquivo; reduz o tamanho antes de enviar ----
  function loadImage(file){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var sc = Math.min(1, 1600 / im.width), c = document.createElement("canvas");
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/jpeg", 0.85);
        img = { media_type: "image/jpeg", data: url.split(",")[1] };
        $("prev").src = url; $("prev").hidden = false;
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  $("drop").onclick = function(){ $("file").click(); };
  $("file").onchange = function(){ if (this.files[0]) loadImage(this.files[0]); };
  document.addEventListener("paste", function(e){
    var it = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < it.length; i++) if (it[i].type.indexOf("image") === 0) { loadImage(it[i].getAsFile()); e.preventDefault(); break; }
  });

  // ---- chamadas ----
  function api(path, params){
    var wait = Math.max(0, lastCall + GAP - Date.now()); lastCall = Date.now() + wait;
    return new Promise(function(r){ setTimeout(r, wait); }).then(function(){
      var qs = ["token=" + encodeURIComponent(token)];
      Object.keys(params).forEach(function(k){ qs.push(k + "=" + encodeURIComponent(params[k])); });
      return fetch("https://api.movidesk.com/public/v1" + path + "?" + qs.join("&"));
    }).then(function(r){ if (!r.ok) throw new Error("Movidesk HTTP " + r.status); return r.json(); });
  }
  function ai(path, body){
    return fetch(WORKER_URL.replace(/\/$/, "") + path, { method: "POST", headers: { "content-type": "application/json", "x-movidesk-token": token }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || ("IA HTTP " + r.status)); return j; }); });
  }
  function findPersons(q){
    var s = q.replace(/'/g, "''");
    var v = q.indexOf("@") > 0 ? ["emails/any(e: e/email eq '" + s + "')"] : ["businessName eq '" + s + "'", "startswith(businessName,'" + s + "')", "contains(businessName,'" + s + "')"];
    var i = 0;
    function next(){
      if (i >= v.length) return Promise.resolve([]);
      return api("/persons", { "$select": "id,businessName", "$filter": v[i++], "$top": "5" }).then(function(r){ return r.length ? r : next(); }).catch(function(){ return next(); });
    }
    return next();
  }
  var STOP = ["para","com","que","uma","nao","por","dos","das","sobre","erro","problema","cliente","favor"];
  function words(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/[^a-z0-9]+/).filter(function(w){ return w.length > 3 && STOP.indexOf(w) < 0; }); }
  function score(t, ex){
    var w = words((ex.assunto || "") + " " + (ex.categoria || "")), h = words(t.subject + " " + (t.category || ""));
    return w.filter(function(x){ return h.indexOf(x) >= 0; }).length;
  }
  function strip(h){ var d = new DOMParser().parseFromString(String(h || ""), "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); }

  // ---- fluxo principal ----
  $("go").onclick = function(){
    if (!WORKER_URL) { setStatus("Configure o WORKER_URL primeiro", true); return; }
    var text = $("txt").value.trim();
    if (!img && !text) { setStatus("Cole um print ou o texto do chat", true); return; }
    var out = $("out"), ex, tickets = [], retornos = [];
    function step(m){ out.innerHTML = '<p class="loading">' + esc(m) + '</p>'; setStatus(m); }
    $("go").disabled = true;
    step("Lendo o print e a conversa…");
    ai("/extract", { image: img, text: text }).then(function(r){
      ex = r;
      var nome = $("cli").value.trim() || r.cliente;
      if (!nome) return [];
      step("Procurando “" + nome + "” no Movidesk…");
      return findPersons(nome);
    }).then(function(ps){
      if (!ps.length) return [];
      ex._clienteMovidesk = ps[0].businessName;
      step("Buscando os tickets de " + ps[0].businessName + " dos últimos 30 dias…");
      var since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 19) + ".00z";
      return api("/tickets", {
        "$select": "id,subject,category,status,baseStatus,createdDate,resolvedIn,serviceFirstLevel",
        "$filter": "clients/any(c: c/id eq '" + String(ps[0].id).replace(/'/g, "''") + "') and createdDate ge " + since,
        "$orderby": "createdDate desc", "$top": "100"
      });
    }).then(function(ts){
      tickets = ts || [];
      var res = tickets.filter(function(t){ return t.baseStatus === "Resolved" || t.baseStatus === "Closed"; })
        .sort(function(a, b){ return score(b, ex) - score(a, ex); }).slice(0, 3);
      var chain = Promise.resolve();
      res.forEach(function(t){
        chain = chain.then(function(){
          step("Lendo como o ticket #" + t.id + " foi resolvido…");
          return api("/tickets", { "$select": "id", "$filter": "id eq '" + t.id + "'", "$expand": "actions", "$top": "1" }).then(function(r){
            var acts = ((r[0] && r[0].actions) || []).filter(function(a){ return Number(a.type) === 2; }), last = acts[acts.length - 1];
            if (last) retornos.push({ id: t.id, retorno: strip(last.description).slice(0, 600) });
          }).catch(function(){});
        });
      });
      return chain;
    }).then(function(){
      step("Analisando e buscando na Ajuda Sankhya…");
      var slim = tickets.slice(0, 40).map(function(t){ return { id: t.id, data: String(t.createdDate).slice(0, 10), assunto: t.subject, categoria: t.category, servico: t.serviceFirstLevel, status: t.status }; });
      return ai("/suggest", { extracao: ex, tickets: slim, retornos: retornos });
    }).then(function(r){ render(ex, tickets, r); setStatus("Análise concluída"); })
      .catch(function(e){ out.innerHTML = '<p class="warn">Não consegui concluir: ' + esc(e.message) + '</p>'; setStatus("Erro", true); })
      .then(function(){ $("go").disabled = false; });
  };

  function render(ex, tickets, r){
    var h = '<div class="card"><h2>' + esc(ex._clienteMovidesk || ex.cliente || "Cliente não identificado") + '</h2>' +
      '<div class="meta">' + esc(ex.categoria || "") + (ex.assunto ? ' · ' + esc(ex.assunto) : '') + '</div>' +
      '<p>' + esc(ex.resumo || "") + '</p>' + (ex._sem_print ? '<p class="meta">A IA não conseguiu ler o print; a análise usou só o texto colado.</p>' : '') +
      (ex._clienteMovidesk ? '<div class="meta">' + tickets.length + ' ticket(s) nos últimos 30 dias</div>' : '<p class="warn">Não achei esse cliente no Movidesk, então a análise não tem o histórico dele. Informe o nome no campo “Nome do cliente” e tente de novo.</p>') + '</div>';
    h += '<div class="card"><h2>Já teve algo parecido nos últimos 30 dias? <span class="' + (r.parecido_30d ? 'yes">Sim' : 'no">Não') + '</span></h2>';
    (r.parecidos || []).forEach(function(p){ h += '<div class="meta"><b>#' + esc(p.id) + '</b> · ' + esc(p.motivo) + '</div>'; });
    if (r.historico) h += '<p>' + esc(r.historico) + '</p>';
    h += '</div><div class="card"><h2>Como resolver</h2>';
    (r.sugestoes || []).forEach(function(s){
      h += '<div><b>' + esc(s.titulo) + '</b><span class="tag">' + esc(s.fonte || "") + '</span><ol>' + (s.passos || []).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ol></div>';
    });
    if (!(r.sugestoes || []).length) h += '<p class="meta">Sem base suficiente para sugerir uma solução.</p>';
    var arts = (r.artigos || []).filter(function(a){ return /^https:\/\/ajuda\.sankhya\.com\.br\//.test(a.url || ""); });
    if (arts.length) h += '<h2>Artigos da Ajuda Sankhya</h2>' + arts.map(function(a){ return '<div><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.titulo) + '</a></div>'; }).join("");
    $("out").innerHTML = h + '</div>';
  }
  show();
})();
</script>
</body>
</html>
